[project]
name = "llm-api-cost-finops-platform"
version = "0.1.0"
description = "FinOps platform for direct LLM API cost, usage, allocation, optimization, and governance."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
